services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: deploylens
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - deploylens-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deploylens"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@db:5432/deploylens
      FRONTEND_URL: http://localhost:4173
    ports:
      - "3004:3001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: sh -c "npx prisma migrate deploy && node dist/server.js"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3004
    ports:
      - "4173:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  startup-summary:
    image: alpine:3.20
    depends_on:
      db:
        condition: service_started
      backend:
        condition: service_started
      frontend:
        condition: service_started
    command: >
      sh -c '
      printf "\n========================================\n";
      printf " DeployLens is running\n";
      printf "========================================\n";
      printf " Frontend: http://localhost:4173\n";
      printf " Backend:  http://localhost:3004\n";
      printf " Database: localhost:5433 -> db:5432\n";
      printf "========================================\n\n";
      '
    restart: "no"

volumes:
  deploylens-postgres: